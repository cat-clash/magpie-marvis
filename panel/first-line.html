<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>首行文本 · 腾讯 Marvis TENCENT</title>
<link rel="stylesheet" href="first-line.css">
<script src="_magpie/bridge.js"></script>
<script src="first-line.js" defer></script>
</head>
<body>

<!-- 只占一行、只放一个按钮：按钮文字就是当前值（空值显示「内置兜底句」）。
     字段名由宿主按 panels.title 渲染；面板内不再有第二行文字 ——
     宿主给这块的高度只有一行，多任何一行都会把下面的「高级」挤重叠。 -->
<section class="fl">
  <button id="open" class="fl-btn" type="button" aria-haspopup="dialog">
    <span id="value">—</span><span class="fl-chevron" aria-hidden="true">›</span>
  </button>
  <p class="fl-status" id="saved" role="status" aria-live="polite"></p>

  <dialog id="dlg" class="fl-dialog">
    <form id="form" method="dialog" class="fl-form">
      <h2 id="title">首行文本</h2>
      <p class="muted" id="hint">
        「每个请求都改首行」打开时，system 提示词的第一行会换成下面这句。留空 = 内置兜底句。
      </p>
      <input id="text" type="text" spellcheck="false" autocomplete="off">
      <p class="muted" id="fallback-note"></p>
      <div class="fl-actions">
        <button id="cancel" class="fl-btn" type="submit" value="cancel">取消</button>
        <button id="save" class="fl-btn fl-primary" type="submit" value="save">保存</button>
      </div>
    </form>
  </dialog>
</section>
</body>
</html>
